name: 自动打包APK并发布下载页 (Build APK & Deploy GitHub Pages)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 配置 Java 17 (Android 编译环境)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 安装依赖并生成 Capacitor Android 原生工程
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: 5. 编译生成安卓安装包 (.apk)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../www/fruit-jilu.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../www/水果成本记账.apk

      - name: 6. 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: 水果成本记账-Android安装包
          path: www/fruit-jilu.apk

      - name: 7. 自动发布到 GitHub Releases (供所有人直接点击下载APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🍎 水果成本记账 App 最新安卓安装包 (自动构建)"
          body: |
            ### 📲 手机下载安装说明
            点击下方 Assets 中的 **`fruit-jilu.apk`** 即可直接下载安装到安卓手机！
            - **在线直接下载链接**：https://github.com/krisawang/fruit-jilu/releases/latest/download/fruit-jilu.apk
            - **采购管理员演示账号**：`13800000001` / 密码：`123456`（可录入修改每日成本价）
            - **普通店员演示账号**：`13800000002` / 密码：`123456`（只读查看每日价格与昨日涨跌对比）
          files: www/fruit-jilu.apk
          prerelease: false

      - name: 8. 打包网页与APK下载站 (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 9. 发布在线访问与扫码下载页 (Deploy to GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
