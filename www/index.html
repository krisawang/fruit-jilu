<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="水果成本表" />
  <title>水果每日成本表</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="phone-preview-mode">
  <!-- 电脑端顶部辅助栏（手机端自动隐藏） -->
  <div class="desktop-toolbar" id="desktopToolbar">
    <div class="desktop-toolbar-left">
      <span class="badge-app">📱 极简报价单模式 (已热修)</span>
      <span class="toolbar-tip">支持同一水果添加多种规格（如：蓝莓 L25 1箱12盒×125g、维纳斯苹果 95mm+ 8个/90mm+ 9个），首页直接记价与看价</span>
    </div>
    <div class="desktop-toolbar-right">
      <button class="btn-toolbar" id="toggleFrameBtn">🖥️ 切换全宽视图</button>
      <button class="btn-toolbar btn-toolbar-primary" id="quickExportCsvBtn">📊 导出 Excel</button>
    </div>
  </div>

  <!-- 手机 App 主容器 -->
  <div class="app-shell" id="appShell">
    <!-- 极简顶部栏 -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand-area">
          <span class="brand-icon">🍎</span>
          <h1 class="brand-title">水果每日成本价</h1>
        </div>
        <div class="header-btns">
          <button class="mode-switch-btn edit-active" id="modeToggleBtn" title="切换直接记价或锁屏只读看价">
            ✏️ 记价中
          </button>
          <button class="btn-header-add" id="topAddSpecBtn">
            ＋ 加水果/规格
          </button>
        </div>
      </div>

      <!-- 日期切换条（内嵌在顶栏下方，干净直观） -->
      <div class="date-bar">
        <button class="date-nav-btn" id="prevDayBtn">◀ 前一天</button>
        <div class="date-picker-box">
          <input type="date" id="selectedDateInput" class="date-input" />
          <span class="date-badge" id="dateRelationTag">今天</span>
        </div>
        <button class="date-nav-btn" id="nextDayBtn">后一天 ▶</button>
        <button class="date-today-btn hidden" id="backTodayBtn">回今天</button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="app-content">
      <!-- ==================== 页面 1：每日价格（直接看价 + 直接记价） ==================== -->
      <section class="tab-page active" id="tab-daily">
        <!-- 顶部单行快捷栏：搜索 + 一键沿用昨日价 + 简要涨跌统计 -->
        <div class="quick-bar">
          <div class="search-wrap">
            <span>🔍</span>
            <input type="text" id="fruitSearchInput" placeholder="搜水果或规格(如: 蓝莓 / L25 / 95mm)..." />
            <button class="clear-search-btn hidden" id="clearSearchBtn">✕</button>
          </div>
          <button class="btn-copy-prev" id="copyYesterdayAllBtn" title="未填的规格一键沿用昨日价格">
            ⚡ 沿用昨日
          </button>
        </div>

        <!-- 水果大类快速筛选条 + 涨跌快筛 -->
        <div class="filter-chips-bar" id="categoryFilterBar"></div>

        <!-- 核心：按水果分组的多规格价格表 -->
        <div class="fruit-groups-container" id="dailyFruitList"></div>

        <!-- 底部大号快捷添加按钮 -->
        <div class="bottom-add-wrap" id="bottomAddWrap">
          <button class="btn-block-add" id="bottomAddSpecBtn">
            ＋ 添加新水果 或 新增规格型号
          </button>
        </div>
      </section>

      <!-- ==================== 页面 2：历史走势对比 ==================== -->
      <section class="tab-page" id="tab-trend">
        <div class="panel-card">
          <div class="trend-controls">
            <div class="form-group" style="margin-bottom:8px;">
              <label for="trendFruitSelect">选择要查看的水果与规格</label>
              <select id="trendFruitSelect" class="select-input"></select>
            </div>
            <div class="period-tabs" id="trendPeriodTabs">
              <button class="period-btn active" data-days="7">近7天</button>
              <button class="period-btn" data-days="14">近14天</button>
              <button class="period-btn" data-days="30">近30天</button>
              <button class="period-btn" data-days="90">全部</button>
            </div>
          </div>

          <div class="trend-stats-row">
            <div class="trend-stat-item">
              <span class="t-label">最新价</span>
              <strong class="t-val" id="trendLatestPrice">--</strong>
            </div>
            <div class="trend-stat-item">
              <span class="t-label">最高价</span>
              <strong class="t-val text-up" id="trendMaxPrice">--</strong>
            </div>
            <div class="trend-stat-item">
              <span class="t-label">最低价</span>
              <strong class="t-val text-down" id="trendMinPrice">--</strong>
            </div>
            <div class="trend-stat-item">
              <span class="t-label">平均价</span>
              <strong class="t-val" id="trendAvgPrice">--</strong>
            </div>
          </div>

          <div class="chart-container" id="chartContainer"></div>
        </div>

        <div class="panel-card">
          <h3 class="panel-title" style="margin-bottom:10px;">🗓️ <span id="historyTableFruitName">规格</span> 历史价格明细</h3>
          <div class="history-table-wrap">
            <table class="history-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>当日成本价</th>
                  <th>折合单价</th>
                  <th>较前日对比</th>
                </tr>
              </thead>
              <tbody id="fruitHistoryTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ==================== 页面 3：同步共享与导出 ==================== -->
      <section class="tab-page" id="tab-settings">
        <!-- GitHub 云同步：一人改价，全员可见 -->
        <div class="panel-card">
          <h3 class="panel-title">☁️ 全员价格同步 (GitHub 免服务器共享)</h3>
          <p class="panel-desc">录完价格点「发布最新价格」，其他人的手机点「刷新同步」就能看到最新价格表。</p>
          <div class="cloud-btn-row" style="margin: 12px 0;">
            <button class="btn-primary" id="uploadCloudBtn" style="flex:1;">📢 发布最新价格 (所有人可见)</button>
            <button class="btn-secondary" id="downloadCloudBtn" style="flex:1;">🔄 刷新同步最新价格</button>
          </div>
          <div class="form-group">
            <label for="githubRepoInput">绑定的 GitHub 仓库</label>
            <input type="text" id="githubRepoInput" class="text-input" value="krisawang/fruit-jilu" />
          </div>
          <div class="form-group">
            <label for="cloudApiKeyInput">管理员发布密钥 (GitHub Token，仅发布者需填，看价不用填)</label>
            <input type="password" id="cloudApiKeyInput" class="text-input" placeholder="粘贴 ghp_ 开头的 Token 保存即可" />
          </div>
          <button class="btn-outline" id="saveCloudConfigBtn" style="width:100%;">💾 保存同步配置</button>
          <div class="cloud-status-log" id="cloudSyncStatusText">本地数据已实时自动保存</div>
        </div>

        <!-- Excel 导出与 JSON 备份 -->
        <div class="panel-card">
          <h3 class="panel-title">📊 导出 Excel 表格与数据备份</h3>
          <div class="backup-btn-grid">
            <button class="backup-action-btn" id="exportCsvBtn">
              <span class="b-icon">📊</span>
              <div class="b-text">
                <strong>导出 Excel 价格表 (.csv)</strong>
                <span>包含水果、品种规格、每箱明细、今日价、昨日价与涨跌对比</span>
              </div>
            </button>
            <button class="backup-action-btn" id="exportJsonBtn">
              <span class="b-icon">💾</span>
              <div class="b-text">
                <strong>导出备份文件 (.json)</strong>
                <span>保存所有自定义水果规格与历史记录</span>
              </div>
            </button>
            <label class="backup-action-btn" for="importJsonFileInput">
              <span class="b-icon">📂</span>
              <div class="b-text">
                <strong>恢复备份文件 (.json)</strong>
                <span>从备份文件导入恢复</span>
              </div>
              <input type="file" id="importJsonFileInput" accept=".json,application/json" class="hidden" />
            </label>
          </div>
        </div>

        <div class="panel-card">
          <h3 class="panel-title">⚙️ 数据初始化</h3>
          <div class="cloud-btn-row" style="margin-top:8px;">
            <button class="btn-outline-danger" id="clearPricesOnlyBtn">🧹 清空价格记录 (保留水果和规格)</button>
            <button class="btn-outline" id="resetDemoDataBtn">🔄 恢复默认示例规格</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 极简底部导航栏 (3个核心板块) -->
    <nav class="app-tabbar">
      <button class="tab-item active" data-tab="tab-daily">
        <span class="tab-icon">📋</span>
        <span class="tab-label">每日价格</span>
      </button>
      <button class="tab-item" data-tab="tab-trend">
        <span class="tab-icon">📈</span>
        <span class="tab-label">历史走势</span>
      </button>
      <button class="tab-item" data-tab="tab-settings">
        <span class="tab-icon">☁️</span>
        <span class="tab-label">同步与导出</span>
      </button>
    </nav>

    <!-- ==================== 新增/编辑「水果与规格」弹窗 ==================== -->
    <div class="modal-overlay hidden" id="specModalOverlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 id="specModalTitle">添加水果与规格</h3>
          <button class="modal-close-btn" id="closeSpecModalBtn">✕</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editSpecIdInput" />

          <!-- 选择或输入水果大类名称 -->
          <div class="form-group">
            <label for="fruitGroupNameInput">1. 水果名称 (大类) <span class="req">*</span></label>
            <div class="fruit-quick-pick" id="existingFruitQuickPick"></div>
            <div style="display:flex;gap:8px;align-items:center;">
              <button type="button" class="emoji-trigger-btn" id="currentEmojiBtn" title="点击换图标">🫐</button>
              <input type="text" id="fruitGroupNameInput" class="text-input" placeholder="如：蓝莓、维纳斯苹果、阳光玫瑰" />
            </div>
            <div class="emoji-picker hidden" id="emojiPickerGrid" style="margin-top:8px;"></div>
          </div>

          <!-- 品种与规格描述 -->
          <div class="form-group">
            <label for="specTitleInput">2. 品种 / 果径 / 规格名称 <span class="req">*</span></label>
            <input type="text" id="specTitleInput" class="text-input" placeholder="如：L25 一箱12盒(单盒125g) 或 礼盒装 95mm+ 8个" />
            <div class="spec-preset-chips">
              <span class="preset-tip">常用示例点击可填：</span>
              <button type="button" class="chip-preset" data-fill="L25 · 1箱12盒 (单盒125g)">L25·1箱12盒(125g)</button>
              <button type="button" class="chip-preset" data-fill="礼盒装 · 95mm+ (8个)">礼盒 95mm+ 8个</button>
              <button type="button" class="chip-preset" data-fill="礼盒装 · 90mm+ (9个)">礼盒 90mm+ 9个</button>
              <button type="button" class="chip-preset" data-fill="礼盒装 · 85mm+ (10个)">礼盒 85mm+ 10个</button>
            </div>
          </div>

          <!-- 计价单位 + 每箱内含数量（自动算单盒/单个成本！） -->
          <div class="form-row-2">
            <div class="form-group">
              <label for="specUnitSelect">3. 计价单位</label>
              <select id="specUnitSelect" class="select-input">
                <option value="元/箱">元/箱</option>
                <option value="元/盒">元/盒</option>
                <option value="元/斤">元/斤</option>
                <option value="元/件">元/件</option>
                <option value="元/公斤">元/公斤</option>
                <option value="元/筐">元/筐</option>
                <option value="元/个">元/个</option>
              </select>
            </div>
            <div class="form-group">
              <label for="specSubCountInput">内含盒数/个数 (选填，自动算单价)</label>
              <div style="display:flex;gap:4px;">
                <input type="number" min="1" step="1" id="specSubCountInput" class="text-input" placeholder="如: 12 或 8" />
                <select id="specSubUnitSelect" class="select-input" style="width:72px;padding:4px;">
                  <option value="盒">盒</option>
                  <option value="个">个</option>
                  <option value="斤">斤</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group" id="initPriceGroup">
            <label for="specInitPriceInput">今日成本价 (选填，可直接录入)</label>
            <input type="number" step="0.1" min="0" id="specInitPriceInput" class="text-input" placeholder="例如：120" />
          </div>
        </div>
        <div class="modal-footer" style="justify-content:space-between;">
          <button type="button" class="btn-outline-danger hidden" id="deleteSpecBtn">🗑️ 删除此规格</button>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <button type="button" class="btn-outline" id="cancelSpecModalBtn">取消</button>
            <button type="button" class="btn-primary" id="saveSpecModalBtn">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 轻提示 Toast -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
